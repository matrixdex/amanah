<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop all — Amanah Health Products</title>
  <meta name="description" content="All Amanah Health Products, natural products by Dr Ali's." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="ga-nav" id="nav">
    <div class="wrap ga-nav__inner">
      <nav class="ga-links" aria-label="Primary"><a href="shop.html">Shop</a><a href="index.html#about">About</a><a href="index.html#faq">FAQ</a></nav>
      <a href="index.html" class="ga-logo"><img class="brand-logo" src="assets/logo.png" alt="" width="256" height="256" />Amanah</a>
      <div class="nav-actions"><button class="bag" data-open-cart>Cart (<span data-cart-count>0</span>)</button><button class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></button></div>
    </div>
  </header>

  <main id="top"><section class="ga-sec ga-shop"><div class="wrap"><h1 class="ga-h2">Shop all</h1></div><div class="ga-track ga-track--all" id="grid"></div></section></main>

  <footer class="ga-foot wrap"><span class="foot-brand"><img class="foot-logo" src="assets/logo.png" alt="Amanah Health Products" width="256" height="256" /><span>© <span id="year"></span> Amanah Health Products. All Rights Reserved.</span></span></footer>


  <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Menu" hidden>
    <div class="menu__top">
      <a href="index.html" class="menu__logo"><img src="assets/logo.png" alt="" width="256" height="256" />Amanah</a>
      <button class="menu__close" type="button" aria-label="Close menu"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></button>
    </div>
    <nav class="menu__links" aria-label="Menu"><a href="shop.html" style="--i:0">Shop</a><a href="index.html#about" style="--i:1">About</a><a href="index.html#faq" style="--i:2">FAQ</a></nav>
    <button class="menu__cart" type="button" data-open-cart style="--i:3">Cart (<span data-cart-count>0</span>)</button>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Shopping cart" aria-hidden="true">
    <div class="drawer__head">
      <h2>Cart</h2>
      <button class="text-btn" data-close-drawer>Close</button>
    </div>
    <div class="drawer__body" id="cartBody"></div>
    <div class="drawer__foot">
      <p class="ship" id="shipText"></p>
      <div class="drawer__row"><span>Subtotal</span><span id="subtotal">£0.00</span></div>
      <button class="btn" id="checkoutBtn">Checkout</button>
    </div>
  </aside>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal__panel">
      <button class="text-btn modal__close" aria-label="Close">Close</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
